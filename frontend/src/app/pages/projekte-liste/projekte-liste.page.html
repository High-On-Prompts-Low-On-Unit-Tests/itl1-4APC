<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Projekte</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngFor="let projekt of projekte()" [routerLink]="['/projekt-detail', projekt.id]" button="true">
      <ion-label>
        <h2>{{ projekt.titel }}</h2>
        <p>{{ projekt.Team?.name }} ({{ projekt.Team?.klasse }})</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
