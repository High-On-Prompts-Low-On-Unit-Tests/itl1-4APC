info:
  name: GET Projekt per ID
  type: http
  seq: 3
  tags:
    - Projects

http:
  method: GET
  url: "{{baseUrl}}/projects/:id"
  params:
    - name: id
      value: "{{projectId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
